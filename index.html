<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0f1022" />
  <title>Cek Jodoh — Interaktif</title>
  <style>
    :root{
      --bg-dark:#0f1022;
      --accent:#ff6b9a;
      --accent-2:#ffb3c6;
      --muted:#9aa0b4;
      --glass: rgba(255,255,255,0.06);
    }
    *{box-sizing:border-box}
    html,body{height:100%;min-height:100vh;margin:0;font-family:Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; background: radial-gradient(circle at 10% 10%, #1b1b2f 0%, #0f1022 40%); color:#eaf1ff; -webkit-text-size-adjust:100%;}

    /* safe area for iPhones (notch, home indicator) */
    body{padding-top:env(safe-area-inset-top);padding-right:env(safe-area-inset-right);padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left)}

    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
    .card{
      width:980px;max-width:98%;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border-radius:18px;padding:calc(18px + env(safe-area-inset-top)) calc(28px + env(safe-area-inset-right)) calc(22px + env(safe-area-inset-bottom)) calc(28px + env(safe-area-inset-left));position:relative;overflow:hidden;box-shadow:0 8px 40px rgba(3,6,23,0.6);
      border:1px solid rgba(255,255,255,0.03);
    }

    header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
    header h1{font-size:20px;margin:0}
    header p{margin:0;color:var(--muted);font-size:13px}

    .controls{display:flex;gap:10px;align-items:center}
    .controls input[type="text"]{flex:1;padding:14px 14px;border-radius:12px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:inherit;font-size:17px;outline:none;-webkit-appearance:none}
    .controls button{padding:12px 18px;border-radius:12px;border:none;background:linear-gradient(90deg,var(--accent),var(--accent-2));color:#1b1020;font-weight:700;cursor:pointer;box-shadow:0 6px 18px rgba(255,107,154,0.12);touch-action:manipulation}
    .controls button[title]{padding:10px 12px}

    .result-area{display:flex;gap:18px;margin-top:14px}
    .left{flex:1;min-height:320px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border-radius:12px;padding:14px;position:relative;overflow:hidden;-webkit-overflow-scrolling:touch}
    .right{width:300px;max-width:33%;min-width:230px}

    .message{font-size:26px;font-weight:700;margin:8px 0}
    .sub{color:var(--muted);margin-top:6px}

    .decor-heart{position:absolute;right:12px;bottom:12px;opacity:0.14;filter:blur(6px);transform:rotate(-20deg)}

    .info-box{background:var(--glass);padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,0.02);color:var(--muted)}

    .btn-reset{margin-top:12px;padding:10px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:var(--muted);cursor:pointer}

    .art{display:flex;align-items:center;justify-content:center;height:260px}
    .art svg{width:100%;height:auto;max-width:420px;filter:drop-shadow(0 10px 30px rgba(0,0,0,0.6))}

    .pulse{animation:pulse 1.6s infinite}
    @keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.02)}100%{transform:scale(1)}}

    .floating-hearts{position:absolute;inset:0;pointer-events:none}
    .floating-hearts i{position:absolute;width:18px;height:18px;transform:translate(-50%,-50%);opacity:0.9}
    .floating-hearts i::before{content:'❤';font-size:18px;display:block}

    .sad{filter:grayscale(40%) contrast(.9)}

    @media (max-width:900px){
      .result-area{flex-direction:column}
      .right{display:block;width:100%}
      .card{padding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom)) 12px}
    }

    /* modal for local image */
    .modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.6);z-index:9999;opacity:0;pointer-events:none;transition:opacity .28s ease}
    .modal.show{opacity:1;pointer-events:auto}
    .modal .content{background:transparent;border-radius:12px;padding:12px;max-width:92%;max-height:82%;display:flex;flex-direction:column;align-items:center;position:relative}
    .modal img{width:100%;height:auto;border-radius:10px;max-height:80vh;object-fit:contain}
    .modal .close{margin-top:10px;padding:8px 12px;border-radius:10px;border:none;background:linear-gradient(90deg,var(--accent),var(--accent-2));color:#111;font-weight:700;z-index:10;position:relative}
    
    /* floating hearts in modal */
    .modal-hearts{position:absolute;inset:0;pointer-events:none;z-index:1}
    .modal-hearts .heart{position:absolute;color:#ff6b9a;font-size:24px;animation:floatUp 4s ease-in infinite;opacity:0}
    @keyframes floatUp{
      0%{transform:translateY(0) rotate(0deg) scale(0);opacity:0}
      10%{opacity:1}
      50%{opacity:0.8}
      100%{transform:translateY(-150px) rotate(360deg) scale(1.5);opacity:0}
    }

    /* iOS touch helpers */
    button, input, select, textarea{ -webkit-tap-highlight-color: rgba(255,255,255,0.06); }

    /* reduced motion support */
    @media (prefers-reduced-motion: reduce){
      .pulse, .floating-hearts i { animation: none !important }
    }

    footer{position:absolute;left:18px;bottom:12px;color:rgba(255,255,255,0.18);font-size:12px}
    input:focus{box-shadow:0 0 0 4px rgba(255,107,154,0.08);border-color:rgba(255,107,154,0.32)}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" role="application" aria-label="Cek Jodoh Interaktif">
      <header>
        <div>
          <h1>Cek Jodoh — Interaktif</h1>
          <p>Masukkan nama untuk lihat apakah dia jodoh Jonathan.</p>
        </div>
      </header>

      <form id="form" class="controls" onsubmit="return false;" aria-label="Form cek jodoh">
        <input id="nameInput" type="text" placeholder="Masukkan nama... contoh: Niki" aria-label="Nama" autocomplete="name" inputmode="text" />
        <button id="checkBtn" type="button">Cek Jodoh</button>
        <button id="surpriseBtn" type="button" title="Acak" style="background:transparent;color:var(--muted);border:1px solid rgba(255,255,255,0.03);">Acak</button>
      </form>

      <div class="result-area" aria-live="polite">
        <div class="left">
          <div class="art" id="artArea" aria-hidden="false">
            <!-- svg art injected by JS -->
            <svg class="decor-heart" viewBox="0 0 24 24" width="220" height="220" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 21s-7-4.438-9-7.334C0 9.89 4.31 4 8.5 6.5 11 8 12 11 12 11s1-3 3.5-4.5C19.69 4 24 9.89 21 13.666 19 16.562 12 21 12 21z" fill="#ff6b9a"/>
            </svg>
          </div>

          <div id="messageArea">
            <div class="message" id="messageText">Siapa jodohmu hari ini?</div>
            <div class="sub" id="subText">Ketik nama dan tekan 'Cek Jodoh'.</div>
          </div>

          <canvas id="particles" style="position:absolute;inset:0;pointer-events:none;z-index:5"></canvas>
          <div class="floating-hearts" id="floatingHearts"></div>

          <!-- modal that shows a single local image -->
          <div id="modal" class="modal" aria-hidden="true">
            <div class="content" role="dialog" aria-modal="true" aria-label="Gambar jodoh">
              <div class="modal-hearts" id="modalHearts"></div>
              <img id="modalImg" src="" alt="Gambar jodoh">
              <button id="modalClose" class="close" type="button">Tutup</button>
            </div>
          </div>
        </div>

        <aside class="right">
          <div class="info-box">
            <h3 style="margin-top:0">Hasil</h3>
            <div id="resultSummary">Belum diperiksa</div>
            <button id="resetBtn" class="btn-reset" type="button">Reset</button>
          </div>

          <div style="height:12px"></div>
          <div class="info-box">
            <strong>Informasi</strong>
            <p class="sub" style="margin:6px 0 0 0">Interaksi akan menampilkan gambar jika kecocokan terdeteksi.</p>
          </div>
        </aside>
      </div>

      <footer>Built with ❤️</footer>
    </div>
  </div>

  <script>
    // --- Config (ubah daftar nama jika perlu) ---
    const matches = new Set(['niki','nikita','nikita rossa','jani']);

    // Utilities
    const el = id => document.getElementById(id);
    const normalize = s => (s||'').toLowerCase().trim().replace(/\s+/g,' ');

    const nameInput = el('nameInput');
    const checkBtn = el('checkBtn');
    const surpriseBtn = el('surpriseBtn');
    const artArea = el('artArea');
    const messageText = el('messageText');
    const subText = el('subText');
    const resultSummary = el('resultSummary');
    const resetBtn = el('resetBtn');

    // Canvas particle system (retina-aware)
    const canvas = el('particles');
    const ctx = canvas.getContext('2d');
    let W = 0, H = 0, DPR = Math.max(1, window.devicePixelRatio || 1);
    function resize(){
      const cw = canvas.clientWidth || canvas.offsetWidth || document.documentElement.clientWidth;
      const ch = canvas.clientHeight || canvas.offsetHeight || document.documentElement.clientHeight;
      canvas.width = Math.max(1, Math.floor(cw * DPR));
      canvas.height = Math.max(1, Math.floor(ch * DPR));
      canvas.style.width = cw + 'px';
      canvas.style.height = ch + 'px';
      ctx.setTransform(DPR,0,0,DPR,0,0);
      W = cw; H = ch;
    }
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', ()=> setTimeout(resize,350));
    resize();

    class Particle{
      constructor(x,y,vx,vy,size,life,type){this.x=x;this.y=y;this.vx=vx;this.vy=vy;this.size=size;this.life=life;this.maxLife=life;this.type=type}
      step(dt){this.life-=dt;this.x+=this.vx*dt;this.y+=this.vy*dt;if(this.type==='heart')this.vy += 10*dt; if(this.type==='drop')this.vy += 200*dt}
      draw(ctx){
        const t = Math.max(0,this.life/this.maxLife);
        ctx.save(); ctx.globalAlpha = Math.min(1,t*1.2);
        if(this.type==='heart'){
          ctx.translate(this.x,this.y);
          ctx.rotate(Math.sin(this.x*0.01 + (1-t))*0.5);
          ctx.scale(this.size/12,this.size/12);
          ctx.beginPath();
          ctx.moveTo(0,-6);
          ctx.bezierCurveTo(-8,-18,-20,-6,0,12);
          ctx.bezierCurveTo(20,-6,8,-18,0,-6);
          ctx.fillStyle = 'rgba(255,107,154,'+ (0.6 + 0.4*(1-t)) +')';
          ctx.fill();
        } else {
          ctx.beginPath();
          ctx.ellipse(this.x,this.y,this.size*0.6,this.size,0,0,Math.PI*2);
          ctx.fillStyle = 'rgba(150,180,255,'+(0.6 + 0.4*(t))+')';
          ctx.fill();
          if(this.y > H-8){ ctx.beginPath(); ctx.ellipse(this.x,H-4,this.size*1.2,2,0,0,Math.PI); ctx.fillStyle='rgba(150,180,255,'+ (t*0.4) +')'; ctx.fill(); }
        }
        ctx.restore();
      }
    }

    let particles = [];
    let last = performance.now();
    let runningMode = null; // 'love' or 'sad'
    function spawnHearts(count){ for(let i=0;i<count;i++){ const x = Math.random()*W; const y = Math.random()*H*0.4; const vx = (Math.random()-0.5)*40; const vy = -50 - Math.random()*80; const size = 8 + Math.random()*22; const life = 3 + Math.random()*2; particles.push(new Particle(x,y,vx,vy,size,life,'heart')); } }
    function spawnDrops(count){ for(let i=0;i<count;i++){ const x = Math.random()*W; const y = -10 - Math.random()*100; const vx = (Math.random()-0.5)*20; const vy = 80 + Math.random()*120; const size = 2 + Math.random()*6; const life = 2 + Math.random()*1; particles.push(new Particle(x,y,vx,vy,size,life,'drop')); } }

    function animate(t){
      const now = t;
      const dt = Math.min(0.04, (now-last)/1000);
      last = now;
      ctx.clearRect(0,0,W,H);
      if(runningMode==='love'){ if(Math.random()<0.4) spawnHearts(1); }
      if(runningMode==='sad'){ if(Math.random()<0.6) spawnDrops(1); }
      particles.forEach(p=>p.step(dt));
      particles = particles.filter(p=>p.life>0 && p.y < H+50 && p.x > -50 && p.x < W+50);
      particles.forEach(p=>p.draw(ctx));
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);

    // Floating decorative hearts (DOM)
    const floating = el('floatingHearts');
    function makeFloatingHearts(){ floating.innerHTML=''; for(let i=0;i<14;i++){ const elI = document.createElement('i'); elI.style.left = (Math.random()*100)+'%'; elI.style.top = (Math.random()*100)+'%'; const s = 8+Math.random()*24; elI.style.fontSize = s+'px'; elI.style.opacity = (0.15+Math.random()*0.6).toFixed(2); const dur = 6+Math.random()*10; elI.style.animation = `floaty ${dur}s ease-in-out ${Math.random()*2}s infinite`; floating.appendChild(elI); } }
    const fltStyle = document.createElement('style'); fltStyle.innerHTML = `@keyframes floaty{0%{transform:translateY(0) rotate(0);}50%{transform:translateY(-40px) rotate(20deg);}100%{transform:translateY(0) rotate(0);}}`;
    document.head.appendChild(fltStyle);
    makeFloatingHearts();

    // Modal handling (local image)
    const modal = el('modal');
    const modalImg = el('modalImg');
    const modalClose = el('modalClose');
    const modalHearts = el('modalHearts');
    let modalHeartsInterval = null;
    
    function createModalHeart(){
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.textContent = '❤';
      heart.style.left = Math.random() * 100 + '%';
      heart.style.bottom = '0';
      heart.style.animationDelay = Math.random() * 2 + 's';
      modalHearts.appendChild(heart);
      
      setTimeout(() => heart.remove(), 4000);
    }
    
    function openModal(imgPath){
      modalImg.src = imgPath;
      modal.classList.add('show');
      modal.setAttribute('aria-hidden','false');
      document.body.style.overflow = 'hidden';
      
      // spawn hearts continuously
      modalHearts.innerHTML = '';
      modalHeartsInterval = setInterval(() => {
        createModalHeart();
        if(Math.random() > 0.5) createModalHeart();
      }, 500);
    }
    
    function closeModal(){
      modal.classList.remove('show');
      modal.setAttribute('aria-hidden','true');
      modalImg.src = '';
      document.body.style.overflow = '';
      
      // stop spawning hearts
      if(modalHeartsInterval){
        clearInterval(modalHeartsInterval);
        modalHeartsInterval = null;
      }
      modalHearts.innerHTML = '';
    }
    modalClose.addEventListener('click', closeModal);
    modal.addEventListener('click', (e)=>{ if(e.target === modal) closeModal(); });

    // update UI
    function setLoveUI(name){
      runningMode='love';
      particles = [];
      makeFloatingHearts();

      // inject romantic svg
      artArea.innerHTML = `
        <svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <linearGradient id="g1" x1="0" x2="1">
              <stop offset="0%" stop-color="#ff9bbd"/>
              <stop offset="100%" stop-color="#ff6b9a"/>
            </linearGradient>
          </defs>
          <rect width="100%" height="100%" rx="12" fill="url(#g1)" opacity="0.06" />
          <g transform="translate(80,20)">
            <g transform="translate(40,40)">
              <ellipse cx="220" cy="210" rx="180" ry="90" fill="rgba(255,255,255,0.06)"/>
              <path d="M120 120c20-50 90-60 120-20s40 80 0 120-140 30-140-30 0-30 20-70z" fill="#ffe6ef" opacity="0.8"/>
            </g>
            <g transform="translate(140,50)">
              <text x="0" y="240" fill="white" font-size="36" font-weight="700">${name} & Jonathan ❤️</text>
            </g>
          </g>
        </svg>
      `;

      // update visible messages
      messageText.textContent = `${name} adalah jodoh Jonathan ❤️`;
      subText.textContent = `Selamat — kecocokan terdeteksi.`;
      resultSummary.innerHTML = `<strong style="color:var(--accent)">Jodoh Jonathan</strong>`;

      // spawn many hearts
      spawnHearts(40);

      // show modal image from local directory (change path if perlu)
      // make sure file exists at images/jodoh.jpg relative to this HTML file
      openModal('images/jodoh.png');

      // extra hearts as confetti
      for(let i=0;i<50;i++){ setTimeout(()=>spawnHearts(1), i*30); }
    }

    function setSadUI(name){
      runningMode='sad';
      particles = [];
      artArea.innerHTML = `
        <svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg">
          <rect width="100%" height="100%" rx="12" fill="rgba(0,0,0,0.35)" />
          <g transform="translate(120,30)">
            <text x="0" y="120" fill="#cbd5e1" font-size="28" font-weight="700">Bukan Jodoh</text>
            <g transform="translate(40,140) scale(1.2)">
              <path d="M12 21s-7-4.438-9-7.334C0 9.89 4.31 4 8.5 6.5 11 8 12 11 12 11s1-3 3.5-4.5C19.69 4 24 9.89 21 13.666 19 16.562 12 21 12 21z" fill="#9aa0b4" transform="translate(40,0) rotate(-10)" />
            </g>
            <text x="0" y="170" fill="#9aa0b4" font-size="13">Nama ${name} tidak ada di daftar.</text>
          </g>
        </svg>
      `;
      messageText.textContent = `Bukan jodoh 💔`;
      subText.textContent = `Sepertinya tidak ada kecocokan.`;
      resultSummary.innerHTML = `<strong style="color:#9aa0b4">Tidak</strong>`;
      spawnDrops(60);
      
      // show sad image
      openModal('images/sad.jpg');
    }

    function checkName(raw){
      const n = normalize(raw);
      if(!n) return;
      if(matches.has(n)) setLoveUI(n);
      else setSadUI(n);
    }

    // interactions
    checkBtn.addEventListener('click', ()=>{ const name = nameInput.value; checkName(name); nameInput.blur(); });
    resetBtn.addEventListener('click', ()=>{ nameInput.value=''; messageText.textContent='Siapa jodohmu hari ini?'; subText.textContent='Ketik nama dan tekan \'Cek Jodoh\'.'; resultSummary.textContent='Belum diperiksa'; runningMode=null; particles = []; artArea.innerHTML=''; makeFloatingHearts(); closeModal(); resize(); });
    surpriseBtn.addEventListener('click', ()=>{ const pool=['Niki','Kirana','Rossa','Jani','Ajeng','Bima','Deni','Nikita Rossa']; const pick = pool[Math.floor(Math.random()*pool.length)]; nameInput.value = pick; checkName(pick); });

    // Enter key to submit
    nameInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); checkBtn.click(); } });

    // iOS UX: keep input visible when keyboard opens
    nameInput.addEventListener('focus', ()=>{ setTimeout(()=>{ nameInput.scrollIntoView({behavior:'smooth',block:'center'}); }, 300); });

    // initial decorations
    (function init(){
      artArea.innerHTML = `
      <svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bggrad" x1="0" x2="1"><stop offset="0%" stop-color="#231b2b"/><stop offset="100%" stop-color="#0f1022"/></linearGradient>
        </defs>
        <rect width="100%" height="100%" fill="url(#bggrad)" rx="12"/>
        <g transform="translate(160,40)">
          <text x="0" y="60" fill="#e7eefb" font-size="34" font-weight="700">Cek Kecocokan</text>
          <text x="0" y="110" fill="#9aa0b4" font-size="14">Masukkan nama untuk melihat hasil.</text>
        </g>
      </svg>
      `;
      resize();
    })();

  </script>
</body>
</html>
